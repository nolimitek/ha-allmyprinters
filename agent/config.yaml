name: AllMyPrinters Agent
version: "0.8.1"
slug: allmyprinters_agent
description: Your 3D printers, spools and filament boxes in one place, running inside Home Assistant.
url: https://github.com/nolimitek/ha-allmyprinters/tree/main/agent
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Host network: the agent finds printers on your network (search, Bambu SSDP, Elegoo broadcast) and phones can pair over Wi-Fi
host_network: true
ingress: true
ingress_port: 8090
panel_icon: mdi:printer-3d
panel_title: AllMyPrinters
# Tells the AllMyPrinters integration where the agent is (Settings → Devices & services → Discovered)
discovery:
  - allmyprinters
hassio_api: true
options:
  language: en
  remote_access: true
schema:
  language: list(en|de|fr|es|it|nl)
  remote_access: bool
  password: password?
